<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Data Geoportal</title>
</head>
<body>
    <h2>Form Input Data Penduduk</h2>

    <form action="input.php" onsubmit="return validateForm()" method="POST">

        <label for="ogc_fid">OGC FID:</label>
        <input type="number" name="ogc_fid" id="ogc_fid" min="1" step="1" required><br><br>

        <label for="Kemantren">Kemantren:</label>
        <input type="text" name="kemantren" id="Kemantren" required><br><br>

        <label for="kelurahan">Kelurahan:</label>
        <input type="text" name="kelurahan" id="kelurahan" required><br><br>

        <label for="latitude">Latitude:</label>
        <input type="number" step="any" name="latitude" id="latitude" required><br><br>

        <label for="longitude">Longitude:</label>
        <input type="number" step="any" name="longitude" id="longitude" required><br><br>

        <label for="alamat">Alamat:</label>
        <input type="text" name="alamat" id="alamat" required><br><br>

        <input type="submit" value="Submit">

    </form>

    <p id="informasi"></p>

    <script>
        function validateForm() {

            let fid = document.getElementById("ogc_fid").value;
            let text = "";

            if (isNaN(fid) || fid < 1 || !Number.isInteger(Number(fid))) {
                text = "OGC FID harus berupa angka bulat dan minimal 1.";

                document.getElementById("informasi").innerHTML = text;

                return false;
            }

            return true;
        }
    </script>

</body>
</html>
