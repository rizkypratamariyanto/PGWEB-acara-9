<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Form Input Data Penduduk</h2>

    <form action="input.php" onsubmit="return validateForm()" method="POST">

        <label for="Kecamatan">Kecamatan:</label>
        <input type="text" name="kecamatan" id="Kecamatan" value="" required><br><br>

        <label for="longitude">Longitude:</label>
        <input type="text" name="longitude" id="longitude" value="" required><br><br>

        <label for="latitude">Latitude:</label>
        <input type="text" name="latitude" id="latitude" value="" required><br><br>

        <label for="luas">Luas:</label>
        <input type="text" name="luas" id="luas" value="" required><br><br>

        <label for="jumlah_penduduk">Jumlah Penduduk:</label>
        <input type="text" name="jumlah_penduduk" id="jumlah_penduduk" value="" required><br><br>

        <input type="submit" value="Submit">
        </form>

        <p id="informasi"></p>

    <script>
        function validateForm() {

    let luas = document.getElementById("luas").value;
    let text="";
    if (isNaN(luas) || luas < 1) {
    text = "Data luas harus angka dan tidak boleh bernilai negatif";
        // stop the form submission
        event.preventDefault();
    } 
    document.getElementById("informasi").innerHTML = text;
    }
</script>
</body>
</html>
